<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaanan - Romantic Music Sanctuary</title>
    <meta name="description" content="A dreamy, minimalist music website featuring the Urdu calligraphy جاناں, a daisy polaroid aesthetic, and an interactive YouTube playlist music player." />
    <meta name="theme-color" content="#2786fe" />
    <meta property="og:title" content="Jaanan - Romantic Music Sanctuary" />
    <meta property="og:description" content="A dreamy, minimalist music website featuring the Urdu calligraphy جاناں, a daisy polaroid aesthetic, and an interactive YouTube playlist music player." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script async src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body class="m-0 p-0 overflow-x-hidden min-h-screen" style="background-color: #2786fe;">
    <script>
      // When opened directly as a file (file:///), show a helpful guide to open http://localhost:3000
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="font-family: -apple-system, BlinkMacSystemFont, \'Segoe UI\', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0b0c10; color: #f3f4f6; margin: 0; padding: 24px; box-sizing: border-box;">' +
              '<div style="max-width: 520px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 36px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); backdrop-filter: blur(16px);">' +
                '<div style="font-size: 48px; margin-bottom: 12px;">🌸</div>' +
                '<h1 style="font-size: 24px; font-weight: 600; margin: 0 0 10px 0; color: #ffffff;">Jaanan Romantic Music Sanctuary</h1>' +
                '<p style="font-size: 14px; color: #9ca3af; margin: 0 0 24px 0; line-height: 1.6;">' +
                  'You opened <code style="background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; color: #fca5a5;">index.html</code> directly from your folder (<span style="color: #f87171;">file://</span>). Modern React + Vite applications require a local server to run.' +
                '</p>' +
                '<div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 12px; padding: 18px; margin-bottom: 24px; text-align: left;">' +
                  '<div style="font-weight: 600; font-size: 13px; color: #e5e7eb; margin-bottom: 8px;">✨ How to run and open the sanctuary:</div>' +
                  '<ol style="margin: 0; padding-left: 20px; font-size: 13px; color: #d1d5db; line-height: 1.8;">' +
                    '<li><strong>If your server is already running:</strong> click the button below.</li>' +
                    '<li><strong>Or in your terminal:</strong> run <code style="background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; color: #6ee7b7;">npm run dev</code></li>' +
                    '<li><strong>Or on Windows:</strong> double-click <strong style="color: #6ee7b7;">start.bat</strong> in this project folder.</li>' +
                  '</ol>' +
                '</div>' +
                '<a href="http://localhost:3000" style="display: inline-block; width: 100%; padding: 14px 24px; background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #ffffff; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 15px; box-sizing: border-box; box-shadow: 0 8px 20px rgba(236, 72, 153, 0.35);">' +
                  'Open http://localhost:3000 &rarr;' +
                '</a>' +
              '</div>' +
            '</div>';
          }
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
